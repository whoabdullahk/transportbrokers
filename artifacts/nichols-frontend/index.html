<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gold Star Transportation, Inc. | Nationwide Freight Brokerage</title>
  <meta name="description"
    content="Gold Star Transportation, Inc. - Nationwide freight brokerage connecting verified carriers with premium freight corridors across North America. USDOT 253494." />

  <!-- Inline Chunk Error Auto-Recovery -->
  <script>
    (function() {
      var key = 'app_chunk_reload';
      function tryReload() {
        var last = sessionStorage.getItem(key);
        var now = Date.now();
        if (!last || now - parseInt(last, 10) > 10000) {
          sessionStorage.setItem(key, now.toString());
          window.location.reload();
        }
      }
      window.addEventListener('vite:preloadError', function(e) {
        e.preventDefault();
        tryReload();
      });
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message.toLowerCase() : '';
        if (
          msg.indexOf('failed to fetch dynamically imported module') !== -1 ||
          msg.indexOf('error loading dynamically imported module') !== -1 ||
          msg.indexOf('loading chunk') !== -1 ||
          msg.indexOf('importing a module script failed') !== -1
        ) {
          tryReload();
        }
      });
    })();
  </script>

  <!-- Non-blocking asynchronous font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  </noscript>
</head>

<body class="bg-brand-black text-white antialiased selection:bg-lime-500 selection:text-black">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
