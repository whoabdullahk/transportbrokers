<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gold Star Transportation, Inc. | Nationwide Freight Brokerage</title>
  <meta name="description"
    content="Gold Star Transportation, Inc. - Nationwide freight brokerage connecting verified carriers with premium freight corridors across North America. USDOT 253494." />

  <!-- Inline Chunk Error Auto-Recovery -->
  <script>
    (function() {
      var key = 'app_chunk_reload';
      function tryReload() {
        var last = sessionStorage.getItem(key);
        var now = Date.now();
        if (!last || now - parseInt(last, 10) > 10000) {
          sessionStorage.setItem(key, now.toString());
          window.location.reload();
        }
      }
      window.addEventListener('vite:preloadError', function(e) {
        e.preventDefault();
        tryReload();
      });
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message.toLowerCase() : '';
        if (
          msg.indexOf('failed to fetch dynamically imported module') !== -1 ||
          msg.indexOf('error loading dynamically imported module') !== -1 ||
          msg.indexOf('loading chunk') !== -1 ||
          msg.indexOf('importing a module script failed') !== -1
        ) {
          tryReload();
        }
      });
    })();
  </script>

  <!-- Non-blocking asynchronous font loading: Geist & Geist Mono (AI Design Skills Spec) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" />
  </noscript>
</head>

<body class="bg-[#07090D] text-white antialiased selection:bg-[#D4AF37] selection:text-black">

        <div style="color:#D4AF37;font-size:11px;font-weight:700;letter-spacing:0.35em;text-transform:uppercase;margin-top:4px;">TRANSPORTATION, INC.</div>
      </div>
      <div style="width:200px;height:3px;background:rgba(255,255,255,0.1);border-radius:9999px;overflow:hidden;position:relative;">
        <div style="width:60%;height:100%;background:linear-gradient(90deg,#D4AF37,#F4C542);border-radius:9999px;"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
