<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background / Shield Gradients -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B38"/>
      <stop offset="50%" stop-color="#0A1428"/>
      <stop offset="100%" stop-color="#050B16"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A8"/>
      <stop offset="35%" stop-color="#F5D061"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B232"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </linearGradient>
    <linearGradient id="goldMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEEA9A"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#946C0B"/>
    </linearGradient>
    <filter id="subtleDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Deep Navy Shield / Hex Emblem Backing -->
  <path d="M100 12 L176 46 L176 124 L100 188 L24 124 L24 46 Z" 
        fill="url(#navyGrad)" 
        stroke="url(#goldRing)" 
        stroke-width="3.5"
        stroke-linejoin="round"
        filter="url(#subtleDrop)"/>

  <!-- Inner Inset Accent Shield Line -->
  <path d="M100 24 L164 53 L164 118 L100 174 L36 118 L36 53 Z" 
        fill="none" 
        stroke="url(#goldMid)" 
        stroke-width="1" 
        stroke-opacity="0.45"
        stroke-linejoin="round"/>

  <!-- Dynamic Transportation Speed / Highway Chevrons (Dual Wings) -->
  <path d="M28 100 L44 88 L52 94 L36 106 Z" fill="url(#goldMid)" opacity="0.6"/>
  <path d="M172 100 L156 88 L148 94 L164 106 Z" fill="url(#goldMid)" opacity="0.6"/>

  <!-- Faceted 5-Point 3D Gold Star -->
  <g filter="url(#subtleDrop)">
    <!-- Point 0 (Top) -->
    <polygon points="100,100 100,38 84.8,81.9" fill="url(#goldLight)"/>
    <polygon points="100,100 100,38 115.2,81.9" fill="url(#goldDark)"/>

    <!-- Point 1 (Top-Right) -->
    <polygon points="100,100 159,80.9 115.2,81.9" fill="url(#goldLight)"/>
    <polygon points="100,100 159,80.9 124.2,107.7" fill="url(#goldDark)"/>

    <!-- Point 2 (Bottom-Right) -->
    <polygon points="100,100 136.4,150.3 124.2,107.7" fill="url(#goldLight)"/>
    <polygon points="100,100 136.4,150.3 100,124.8" fill="url(#goldDark)"/>

    <!-- Point 3 (Bottom-Left) -->
    <polygon points="100,100 63.6,150.3 100,124.8" fill="url(#goldLight)"/>
    <polygon points="100,100 63.6,150.3 75.8,107.7" fill="url(#goldDark)"/>

    <!-- Point 4 (Top-Left) -->
    <polygon points="100,100 41,80.9 75.8,107.7" fill="url(#goldLight)"/>
    <polygon points="100,100 41,80.9 84.8,81.9" fill="url(#goldDark)"/>

    <!-- Center Facet Core Starlet Highlight -->
    <circle cx="100" cy="100" r="4.5" fill="#FFF9D2"/>
  </g>
</svg>